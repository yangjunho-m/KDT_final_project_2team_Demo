services:
  backend:
    build: .
    container_name: drone-platform-backend
    env_file:
      - .env
    environment:
      AUTO_CREATE_DEMO_DRONES: "true"
      DRONE_VIEW_PLAYBACK_SPEED: "1.0"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
    restart: unless-stopped
    volumes:
      - faiss_data:/app/storage/faiss

  postgres:
    image: postgis/postgis:16-3.4
    container_name: drone-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drone_platform}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: drone-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER를 .env에 설정하세요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD를 .env에 설정하세요}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  faiss_data:
